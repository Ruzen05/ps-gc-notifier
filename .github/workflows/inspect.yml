name: Inspect pages (manual)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Show what the bot sees
        run: python notifier.py --inspect
      - uses: actions/upload-artifact@v4
        with:
          name: page-text
          path: inspect/
