name: Check PlayStation gift cards

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: psgc-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Check stock (every 5 mins for 5 hours)
        run: timeout 300m python -u notifier.py || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Save state
        run: |
          if [ -f state.json ]; then
            git config user.name "stock-bot"
            git config user.email "stock-bot@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "update state" && git pull --rebase -X theirs origin main && git push)
          fi
      - name: Start next 5-hour run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run check.yml --repo ${{ github.repository }}
          fi
